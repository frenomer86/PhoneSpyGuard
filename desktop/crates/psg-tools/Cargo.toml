[package]
name = "psg-tools"
description = "Command-line tools: sign rule bundles (Ed25519, 2-of-3), verify exported timelines, and run a check without the GUI."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
psg-core.workspace = true
psg-windows.workspace = true
serde_json.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
rand_core.workspace = true
sha2.workspace = true
time.workspace = true
serde.workspace = true

[[bin]]
name = "psg-sign"
path = "src/bin/psg-sign.rs"

[[bin]]
name = "psg-verify"
path = "src/bin/psg-verify.rs"

[[bin]]
name = "psg-scan"
path = "src/bin/psg-scan.rs"

[[bin]]
name = "psg-codesign"
path = "src/bin/psg-codesign.rs"
