[workspace]
resolver = "2"
members = [
    "crates/psg-core",
    "crates/psg-windows",
    "crates/psg-tools",
    "crates/psg-scam",
    "app/src-tauri",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
base64 = "0.22"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
rand_core = { version = "0.6", features = ["getrandom"] }
psg-core = { path = "crates/psg-core" }
psg-windows = { path = "crates/psg-windows" }
psg-scam = { path = "crates/psg-scam" }

[profile.release]
# Keeps the installer well under the 20 MB budget (NFR-DSK-01).
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
