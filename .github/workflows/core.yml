name: Core (Kotlin)
on:
  push:
    paths: ["core/**", "desktop/conformance/**", "desktop/rules/**", "gradle/**", "*.gradle.kts", "gradle.properties", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", "desktop/conformance/**", "desktop/rules/**", "gradle/**", "*.gradle.kts", "gradle.properties", ".github/workflows/core.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # The Android :app module is skipped without an SDK, so this runs the
      # pure-JVM core and the cross-engine conformance tests.
      - name: Unit tests
        run: env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew test --no-daemon
