# XcodeGen spec for the iPhone app. On a Mac:
#   brew install xcodegen
#   cd ios/App && xcodegen generate && open PhoneSpyGuard.xcodeproj
# The app links the PSGCore and PSGCompanion libraries from the Swift package
# one folder up, so the logic Xcode builds is the same code the tests cover.
name: PhoneSpyGuard
options:
  bundleIdPrefix: com.phonespyguard
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  PhoneSpyGuardIOS:
    path: ..
targets:
  PhoneSpyGuard:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: PhoneSpyGuardIOS
        product: PSGCore
      - package: PhoneSpyGuardIOS
        product: PSGCompanion
    info:
      path: Resources/Info.plist
      properties:
        # A neutral name protects someone whose phone is checked by an abuser
        # (FR-SAF-05). iOS cannot rename an installed app, so it is chosen
        # here, at build time: set PSG_DISPLAY_NAME below.
        CFBundleDisplayName: $(PSG_DISPLAY_NAME)
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: false
        # Where signed rule updates are fetched from (RuleUpdates.swift).
        # Empty means this build uses only the rules inside it.
        PSGRulesBaseURL: $(PSG_RULES_BASE_URL)
        NSFaceIDUsageDescription: "Face ID unlocks the app when you turn on its lock in Safety."
        LSApplicationQueriesSchemes: [cydia, sileo, zbra, filza, undecimus]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Diagnostic archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.gnu.gnu-zip-archive, public.tar-archive, org.gnu.gnu-zip-tar-archive, public.log, public.plain-text, public.json, public.data]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phonespyguard.ios
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Neutral
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        # Same as Android. A build for someone at risk can use a neutral
        # name such as "System Services" (Android's discreet name).
        PSG_DISPLAY_NAME: Phone Spy Guard
        # The https:// folder that serves ios-bundle.json, ios-indicators.json,
        # scam-domains.json/.bin and their .sig.json files, as published by
        # `psg-ios-check sign`. The release workflow refuses to build without it.
        PSG_RULES_BASE_URL: ""
        GENERATE_INFOPLIST_FILE: false
        # Set your own team in Xcode (Signing & Capabilities) to run on a device.
        DEVELOPMENT_TEAM: ""
      configs:
        # Debug builds accept the development rule keys (see BuildFlags.swift).
        # Release builds refuse them unless built as a lab build with
        #   SWIFT_ACTIVE_COMPILATION_CONDITIONS=PSG_ALLOW_DEV_KEYS
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
